name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PACKAGE_NAME: luci-app-simple-sing-box
  # This is a pure-script package (no compiled binaries), so the built apk/ipk
  # are architecture-independent: apk uses "noarch", ipk uses "all".
  ARCH_APK: noarch
  ARCH_IPK: all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          # Prefer a pushed tag (v1.0.0 -> 1.0.0), else date-based snapshot.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version=$v"

      - name: Stage package tree
        run: |
          set -e
          STAGE="${RUNNER_TEMP}/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          # Copy the rootfs overlay verbatim (etc/, usr/...).
          cp -a root/. "$STAGE/"
          # LuCI static assets live under /www on the target.
          mkdir -p "$STAGE/www"
          cp -a htdocs/. "$STAGE/www/"
          # Ensure standard runtime + executable dirs exist.
          mkdir -p "$STAGE/etc/simple-sing-box" "$STAGE/usr/share/simple-sing-box"
          chmod 0755 "$STAGE/etc/init.d/simple-sing-box"
          chmod 0755 "$STAGE/usr/libexec/simple-sing-box-subscribe"
          [ -f "$STAGE/etc/uci-defaults/simple-sing-box" ] && chmod 0755 "$STAGE/etc/uci-defaults/simple-sing-box"
          # Print the tree for log visibility.
          echo "=== staged tree ==="
          ( cd "$STAGE" && find . -maxdepth 4 | sort )
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Prepare signing key
        # When the APK_SIGN_KEY secret is set (private key only), write it to a
        # file so the build can sign the apk. The build script derives the
        # matching public key at runtime to verify the signature. If the secret
        # is empty, the apk is built unsigned.
        run: |
          set -e
          mkdir -p "${RUNNER_TEMP}/keys"
          if [ -n "${{ secrets.APK_SIGN_KEY }}" ]; then
            printf '%s\n' '${{ secrets.APK_SIGN_KEY }}' > "${RUNNER_TEMP}/keys/sign.rsa"
            chmod 0600 "${RUNNER_TEMP}/keys/sign.rsa"
            echo "Signing key prepared."
          else
            echo "APK_SIGN_KEY not set; the apk will be built unsigned."
          fi

      - name: Build .apk and .ipk (alpine:edge container)
        # Ubuntu has no `apk-tools` package, so the packages are built inside an
        # alpine:edge container, where apk (with `mkpkg`) and binutils' `ar` are
        # available natively. The build scripts take only a staging dir, an
        # output path and an optional signing key, so only .github/ needs
        # mounting.
        run: |
          set -e
          mkdir -p "${RUNNER_TEMP}/out"
          chmod -R a+rX "${STAGE}"
          docker run --rm \
            -e VERSION="${{ steps.ver.outputs.version }}" \
            -e PACKAGE_NAME="${PACKAGE_NAME}" \
            -e ARCH_APK="${ARCH_APK}" \
            -e ARCH_IPK="${ARCH_IPK}" \
            -v "${STAGE}:/stage:ro" \
            -v "${RUNNER_TEMP}/out:/out" \
            -v "${RUNNER_TEMP}/keys:/keys" \
            -v "${GITHUB_WORKSPACE}/.github:/scripts:ro" \
            alpine:edge sh -c '
              set -e
              apk add --no-cache bash openssl binutils tar >/dev/null
              SIGN=""
              [ -f /keys/sign.rsa ] && SIGN=/keys/sign.rsa
              bash /scripts/build_openwrt_apk.sh \
                "$ARCH_APK" "$VERSION" /stage \
                "/out/${PACKAGE_NAME}-${VERSION}.apk" "$SIGN" "$PACKAGE_NAME"
              bash /scripts/build_openwrt_ipk.sh \
                "$ARCH_IPK" "$VERSION" /stage \
                "/out/${PACKAGE_NAME}-${VERSION}.ipk" "$PACKAGE_NAME"
            '
          echo "=== built artifacts ==="
          ls -la "${RUNNER_TEMP}/out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ steps.ver.outputs.version }}
          path: |
            ${{ runner.temp }}/out/*.apk
            ${{ runner.temp }}/out/*.ipk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Publish as a draft so the release is not visible until manually
          # reviewed and published.
          draft: true
          files: |
            ${{ runner.temp }}/out/*.apk
            ${{ runner.temp }}/out/*.ipk
